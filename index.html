<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web</title>
    <style>
        body {
            background-color: #181a1b;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #242729;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        h1, h2 {
            color: #58a6ff;
        }
        pre {
            background-color: #111213;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            color: #a5d6ff;
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 1rem 0;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 0.5rem 0;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenido a mi sitio</h1>
        <p>Esta es una página web base con diseño oscuro y cómodo para la vista.</p>
        
        <h2>Ejemplo de programación</h2>
        <pre><code>console.log("Hola desde la consola web");</code></pre>

        <h2>Imagen de ejemplo</h2>
        <img src="Referencias.png" alt="Imagen de ejemplo">

        <h2>Cursos Libres Recomendados</h2>
        <ul>
            <li><a href="https://www.freecodecamp.org/espanol/" target="_blank">freeCodeCamp Español</a></li>
            <li><a href="https://moure.dev" target="_blank">MoureDev</a></li>
            <li><a href="https://www.edx.org/" target="_blank">edX</a></li>
        </ul>
    </div>
</body>
</html>
